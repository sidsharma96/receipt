# TEMPLATE ONLY. Names must be selected and checked before creating resources.
app = "replace-with-new-receipt-api-name"
primary_region = "sjc"
kill_signal = "SIGTERM"
kill_timeout = 15

[build]
  dockerfile = "deploy/fly/Dockerfile"

[deploy]
  strategy = "rolling"
  # No release_command: Receipt migration also binds the mounted blob directory.

[env]
  GOMEMLIMIT = "320MiB"
  # RECEIPT_DATABASE_URL must be a runtime secret, never a value in this file.

[[mounts]]
  source = "receipt_blobs"
  destination = "/data"
  initial_size = "3gb"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"

[[services]]
  protocol = "tcp"
  internal_port = 7777
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [services.concurrency]
    type = "requests"
    soft_limit = 2
    hard_limit = 4

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "30s"

[[restart]]
  policy = "on-failure"
  retries = 5
