<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" role="img" aria-labelledby="title desc">
<title id="title">An executable hash and a probe hash are separate inputs</title>
<desc id="desc">Executable bytes pass through a 32 KiB buffer into their raw SHA-256 identity. Fresh Go environment output is normalized and hashed into a toolchain identity. Both identities enter the manifest key. A probe error stops reuse. Direct pytest retains a full read so the same bytes supply its hash and shebang.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#38556e"/></marker></defs>
<rect width="860" height="330" rx="12" fill="#f4f8fc"/>
<g font-family="system-ui,sans-serif" fill="#18334a">
<text x="22" y="31" font-size="21" font-weight="bold">One key needs two distinct observations</text>
<text x="22" y="55" font-size="14">Illustrative Go flow. Arrows show data movement, not measured durations.</text>
<g fill="#dcebf8" stroke="#6587a3"><rect x="22" y="80" width="170" height="64" rx="6"/><rect x="230" y="80" width="190" height="64" rx="6"/><rect x="458" y="80" width="166" height="64" rx="6"/></g>
<text x="36" y="106" font-size="16">Executable bytes</text><text x="36" y="129" font-size="14">read every scan</text>
<text x="244" y="106" font-size="16">32 KiB buffer → hash</text><text x="244" y="129" font-size="14">empty prefix</text>
<text x="472" y="106" font-size="16">Executable Input</text><text x="472" y="129" font-size="14">path + raw digest</text>
<g fill="#def0e7" stroke="#5c8d77"><rect x="22" y="180" width="170" height="64" rx="6"/><rect x="230" y="180" width="190" height="64" rx="6"/><rect x="458" y="180" width="166" height="64" rx="6"/></g>
<text x="36" y="206" font-size="16">go env -json</text><text x="36" y="229" font-size="14">run fresh each scan</text>
<text x="244" y="206" font-size="16">Normalize → hash</text><text x="244" y="229" font-size="14">existing rules</text>
<text x="472" y="206" font-size="16">Toolchain Input</text><text x="472" y="229" font-size="14">name + output digest</text>
<rect x="688" y="125" width="150" height="72" rx="7" fill="#fff" stroke="#6587a3"/>
<text x="705" y="153" font-size="16">Manifest → key</text><text x="705" y="178" font-size="14">same encoding</text>
<g fill="none" stroke="#38556e" stroke-width="2" marker-end="url(#arrow)"><path d="M193 112H226"/><path d="M421 112H454"/><path d="M193 212H226"/><path d="M421 212H454"/><path d="M625 112H656V145H684"/><path d="M625 212H656V176H684"/></g>
<text x="22" y="282" font-size="15">Probe failure → no successful input description; no stale probe result is substituted.</text>
<text x="22" y="309" font-size="15">Direct pytest exception: complete read supplies both raw hash and original shebang parser.</text>
</g></svg>
