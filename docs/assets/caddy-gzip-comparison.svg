<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" role="img" aria-labelledby="title desc">
<title id="title">Actual Caddy gzip: fewer bytes, a small latency difference on this short path</title>
<desc id="desc">Identity writes 64,252 body bytes; gzip writes about 20,040. Both decode identically. Median CLI latency is 120.53 versus 118.22 milliseconds. One Caddy process carries memory between batches: sampled maximum RSS grows from 55 to 59 megabytes across both encodings.</desc>
<rect width="960" height="650" rx="14" fill="#111827"/>
<g font-family="system-ui,sans-serif" fill="#e5e7eb">
<text x="34" y="38" font-size="23" font-weight="bold">Actual Caddy endpoint: same decoded result, fewer body bytes</text>
<text x="34" y="68" font-size="16">90 fetches per encoding • median TCP connection about 1.9 ms</text>
<text x="34" y="131" font-size="17">Identity</text>
<rect x="155" y="108" width="558.99" height="34" fill="#89b4fa"/>
<text x="165" y="131" font-size="16" fill="#111827">64,252 B</text>
<path d="M 713.99 125 H 785" stroke="#89b4fa" stroke-width="2" stroke-dasharray="5 4"/>
<path d="M 778 119 l 8 6 l -8 6" fill="none" stroke="#89b4fa" stroke-width="2"/>
<text x="34" y="181" font-size="17">Gzip</text>
<rect x="155" y="158" width="174.35" height="34" fill="#a6e3a1"/>
<text x="165" y="181" font-size="16" fill="#111827">20,040 B</text>
<path d="M 329.35 175 H 785" stroke="#a6e3a1" stroke-width="2" stroke-dasharray="5 4"/>
<path d="M 778 169 l 8 6 l -8 6" fill="none" stroke="#a6e3a1" stroke-width="2"/>
<text x="800" y="130" font-size="16">Go reconstructs</text>
<text x="800" y="155" font-size="16">64,252 B</text>
<text x="800" y="180" font-size="16">Same SHA-256</text>
<text x="34" y="225" font-size="15">68.8% less encoded body data; headers and TLS/TCP overhead excluded.</text>
<path d="M 34 246 H 926" stroke="#4b5563"/>
<text x="34" y="278" font-size="21" font-weight="bold">Whole CLI median latency (common scale from zero)</text>
<text x="34" y="321" font-size="17">Identity</text>
<rect x="155" y="299" width="542.37" height="29" fill="#89b4fa"/>
<text x="707.37" y="320" font-size="16">120.53 ms</text>
<text x="34" y="360" font-size="17">Gzip</text>
<rect x="155" y="338" width="531.99" height="29" fill="#a6e3a1"/>
<text x="696.99" y="359" font-size="16">118.22 ms</text>
<path d="M 34 392 H 926" stroke="#4b5563"/>
<text x="34" y="424" font-size="21" font-weight="bold">One Caddy process carries memory across both encodings</text>
<text x="34" y="451" font-size="15">Sampled max RSS by batch in time order; these are not fresh per-variant peaks.</text>
<circle cx="155" cy="548.77" r="5" fill="#89b4fa"/>
<text x="155" y="535.77" text-anchor="middle" font-size="15">55.02 MB</text>
<text x="155" y="591" text-anchor="middle" font-size="15">identity 1</text>
<circle cx="288" cy="539.35" r="5" fill="#a6e3a1"/>
<text x="288" y="526.35" text-anchor="middle" font-size="15">55.74 MB</text>
<text x="288" y="591" text-anchor="middle" font-size="15">gzip 1</text>
<circle cx="421" cy="526.89" r="5" fill="#a6e3a1"/>
<text x="421" y="513.89" text-anchor="middle" font-size="15">56.70 MB</text>
<text x="421" y="591" text-anchor="middle" font-size="15">gzip 2</text>
<circle cx="554" cy="514.48" r="5" fill="#89b4fa"/>
<text x="554" y="501.48" text-anchor="middle" font-size="15">57.66 MB</text>
<text x="554" y="591" text-anchor="middle" font-size="15">identity 2</text>
<circle cx="687" cy="499.36" r="5" fill="#89b4fa"/>
<text x="687" y="486.36" text-anchor="middle" font-size="15">58.82 MB</text>
<text x="687" y="591" text-anchor="middle" font-size="15">identity 3</text>
<circle cx="820" cy="495.21" r="5" fill="#a6e3a1"/>
<text x="820" y="482.21" text-anchor="middle" font-size="15">59.14 MB</text>
<text x="820" y="591" text-anchor="middle" font-size="15">gzip 3</text>
<polyline points="155,548.77 288,539.35 421,526.89 554,514.48 687,499.36 820,495.21" stroke="#9ca3af" fill="none" stroke-width="2"/>
<text x="34" y="630" font-size="15">All 180 calls retained. Original production configuration restored after the test.</text>
</g></svg>
