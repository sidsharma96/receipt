<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
<title id="title">Gzip sends 70 percent fewer body bytes and helps on the delayed link</title>
<desc id="desc">Identity transfers 62,728 body bytes; gzip transfers 19,073. Both decode to the same 62,728-byte result. Median whole-command latency is 69.5 versus 71.3 milliseconds without added delay, 192.3 versus 169.2 at 24 milliseconds added round-trip delay, and 392.4 versus 329.2 at 64 milliseconds.</desc>
<rect width="960" height="640" rx="14" fill="#111827"/>
<g font-family="system-ui,sans-serif" fill="#e5e7eb">
<text x="34" y="38" font-size="23" font-weight="bold">Same saved result, fewer transferred body bytes</text>
<text x="34" y="68" font-size="16">Linux CI • current Receipt handler • fresh Go gzip level-5 encoder</text>
<text x="155" y="105" font-size="15">Server → encoded HTTP body (bars share one byte scale)</text>
<text x="34" y="155" font-size="17">Identity</text>
<rect x="155" y="132" width="552.01" height="36" fill="#89b4fa"/>
<text x="165" y="156" font-size="16" fill="#111827">62,728 B</text>
<path d="M 707.01 150 H 785" stroke="#89b4fa" stroke-width="2" stroke-dasharray="5 4"/>
<path d="M 778 144 l 8 6 l -8 6" fill="none" stroke="#89b4fa" stroke-width="2"/>
<text x="34" y="209" font-size="17">Gzip</text>
<rect x="155" y="186" width="167.84" height="36" fill="#a6e3a1"/>
<text x="165" y="210" font-size="16" fill="#111827">19,073 B</text>
<path d="M 322.84 204 H 785" stroke="#a6e3a1" stroke-width="2" stroke-dasharray="5 4"/>
<path d="M 778 198 l 8 6 l -8 6" fill="none" stroke="#a6e3a1" stroke-width="2"/>
<text x="800" y="150" font-size="16">Client decodes</text>
<text x="800" y="174" font-size="16">62,728 B</text>
<text x="800" y="200" font-size="16">Same SHA-256</text>
<text x="34" y="254" font-size="16">69.6% less HTTP body data; headers, TLS and TCP overhead are excluded.</text>
<path d="M 34 277 H 926" stroke="#4b5563"/>
<text x="34" y="312" font-size="22" font-weight="bold">Whole CLI latency: 60 measured calls per bar</text>
<rect x="688" y="297" width="15" height="15" fill="#89b4fa"/><text x="711" y="311" font-size="15">Identity</text>
<rect x="804" y="297" width="15" height="15" fill="#a6e3a1"/><text x="827" y="311" font-size="15">Gzip</text>
<text x="34" y="375" font-size="16">+0 ms RTT</text>
<rect x="170" y="346" width="107.71" height="23" fill="#89b4fa"/>
<text x="287.71" y="363" font-size="15">69.5 ms</text>
<rect x="170" y="375" width="110.53" height="23" fill="#a6e3a1"/>
<text x="290.53" y="392" font-size="15">71.3 ms</text>
<text x="34" y="451" font-size="16">+24 ms RTT</text>
<rect x="170" y="422" width="298.12" height="23" fill="#89b4fa"/>
<text x="478.12" y="439" font-size="15">192.3 ms</text>
<rect x="170" y="451" width="262.32" height="23" fill="#a6e3a1"/>
<text x="442.32" y="468" font-size="15">169.2 ms</text>
<text x="34" y="527" font-size="16">+64 ms RTT</text>
<rect x="170" y="498" width="608.20" height="23" fill="#89b4fa"/>
<text x="788.20" y="515" font-size="15">392.4 ms</text>
<rect x="170" y="527" width="510.24" height="23" fill="#a6e3a1"/>
<text x="690.24" y="544" font-size="15">329.2 ms</text>
<text x="34" y="596" font-size="15">RTT = round-trip delay added on a private link, not Internet latency.</text>
<text x="34" y="621" font-size="15">All 360 calls retained, including outliers. Medians; no production deployment claim.</text>
</g></svg>
