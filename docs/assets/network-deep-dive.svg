<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 800" role="img" aria-labelledby="title desc">
<title id="title">Why a fresh remote fetch takes hundreds of milliseconds</title>
<desc id="desc">One actual391ms request timeline. Separate second-run server window growth and fresh versus reused controls. No fingerprinting in these times.</desc>
<rect width="880" height="800" rx="12" fill="#f7fafc"/>
<style>text{font-family:system-ui,sans-serif;fill:#172b4d;font-size:20px}.small{font-size:17px}.title{font-size:25px;font-weight:700}</style>
<text x="24" y="38" class="title">One actual fetch: 391.0 ms</text>
<text x="24" y="67" class="small">65 ms network path · fresh process · same saved result · no fingerprinting</text>
<rect x="24.00" y="90" width="7.16" height="50" fill="#9575cd"/>
<rect x="31.16" y="90" width="137.59" height="50" fill="#1565c0"/>
<rect x="168.75" y="90" width="171.12" height="50" fill="#00838f"/>
<rect x="339.86" y="90" width="205.78" height="50" fill="#558b2f"/>
<rect x="545.64" y="90" width="276.61" height="50" fill="#ef6c00"/>
<rect x="822.25" y="90" width="20.85" height="50" fill="#ad1457"/>
<rect x="24" y="165" width="16" height="16" fill="#9575cd"/>
<text x="50" y="180">DNS: 3.4 ms</text>
<rect x="304" y="165" width="16" height="16" fill="#1565c0"/>
<text x="330" y="180">TCP: 65.6 ms</text>
<rect x="584" y="165" width="16" height="16" fill="#00838f"/>
<text x="610" y="180">TLS: 81.6 ms</text>
<rect x="24" y="205" width="16" height="16" fill="#558b2f"/>
<text x="50" y="220">First byte: 98.1 ms</text>
<rect x="304" y="205" width="16" height="16" fill="#ef6c00"/>
<text x="330" y="220">Body: 131.9 ms</text>
<rect x="584" y="205" width="16" height="16" fill="#ad1457"/>
<text x="610" y="220">Decode: 9.9 ms</text>
<text x="24" y="257" class="small">About 0.4 ms of small gaps completes this one-request timeline.</text>
<text x="24" y="312" class="title">Why fresh body delivery waits for acknowledgments</text>
<text x="24" y="341" class="small">Separate 51 ms-path run: selected states from one matched server socket</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#176b87"/></marker></defs>
<rect x="24" y="370" width="166" height="80" rx="7" fill="#dceef5" stroke="#7da7bb"/>
<text x="107" y="402" text-anchor="middle" font-weight="700">10 segments</text>
<text x="107" y="432" text-anchor="middle" class="small">window</text>
<text x="215" y="389" text-anchor="middle" class="small">ACK</text><path d="M195 410 H234" stroke="#176b87" stroke-width="2" marker-end="url(#a)"/>
<rect x="242" y="370" width="166" height="80" rx="7" fill="#dceef5" stroke="#7da7bb"/>
<text x="325" y="402" text-anchor="middle" font-weight="700">20 segments</text>
<text x="325" y="432" text-anchor="middle" class="small">window</text>
<text x="433" y="389" text-anchor="middle" class="small">ACK</text><path d="M413 410 H452" stroke="#176b87" stroke-width="2" marker-end="url(#a)"/>
<rect x="460" y="370" width="166" height="80" rx="7" fill="#dceef5" stroke="#7da7bb"/>
<text x="543" y="402" text-anchor="middle" font-weight="700">40 segments</text>
<text x="543" y="432" text-anchor="middle" class="small">window</text>
<text x="651" y="389" text-anchor="middle" class="small">ACK</text><path d="M631 410 H670" stroke="#176b87" stroke-width="2" marker-end="url(#a)"/>
<rect x="678" y="370" width="166" height="80" rx="7" fill="#dceef5" stroke="#7da7bb"/>
<text x="761" y="402" text-anchor="middle" font-weight="700">60 segments</text>
<text x="761" y="432" text-anchor="middle" class="small">window</text>
<text x="24" y="480" class="small">Window grows as delivery is acknowledged; intermediate states omitted.</text>
<text x="24" y="537" class="title">Keep the connection: measured diagnostic control</text>
<text x="24" y="578">Fresh process</text>
<rect x="270" y="556" width="445.5" height="30" fill="#1565c0" rx="4"/>
<text x="725.5" y="578">303.3 ms</text>
<text x="24" y="644">Reused connection</text>
<rect x="270" y="622" width="117.2" height="30" fill="#176b87" rx="4"/>
<text x="397.2" y="644">79.8 ms</text>
<text x="24" y="706" class="small">Same 51 ms-path run. Reuse excludes the first cold request; later batch.</text>
<text x="24" y="735" class="small">A resident process enables this control. No daemon or optimization adopted.</text>
<text x="24" y="771" class="small">Server warming and observer costs remain; these are not production savings.</text>
</svg>
