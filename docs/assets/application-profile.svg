<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 690" role="img" aria-labelledby="title desc">
<title id="title">Live Receipt CPU samples and repeated JSON reading</title>
<desc id="desc">Disjoint leaf CPU categories and a three-step shape-check, typed-decode and nested-check sequence. CPU samples do not measure waiting.</desc>
<rect width="760" height="690" rx="12" fill="#f7fafc"/>
<style>text{font-family:system-ui,sans-serif;fill:#172b4d;font-size:19px}.small{font-size:16px}.heading{font-size:23px;font-weight:700}</style>
<text x="24" y="38" class="heading">Where the CPU sample stopped</text>
<text x="24" y="66" class="small">1,589 live user-CPU samples · categories do not overlap</text>
<text x="24" y="102">JSON functions</text>
<rect x="300" y="83" width="330.5" height="26" rx="4" fill="#176b87"/>
<text x="640.5" y="102">53.3%</text>
<text x="24" y="153">Regular expressions</text>
<rect x="300" y="134" width="94.8" height="26" rx="4" fill="#176b87"/>
<text x="404.8" y="153">15.3%</text>
<text x="24" y="204">SHA-256</text>
<rect x="300" y="185" width="24.6" height="26" rx="4" fill="#176b87"/>
<text x="334.6" y="204">4.0%</text>
<text x="24" y="255">Allocator</text>
<rect x="300" y="236" width="22.6" height="26" rx="4" fill="#176b87"/>
<text x="332.6" y="255">3.7%</text>
<text x="24" y="306">Other / missing frames</text>
<rect x="300" y="287" width="147.5" height="26" rx="4" fill="#176b87"/>
<text x="457.5" y="306">23.8%</text>
<text x="24" y="377" class="heading">Why one object is read again</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b87"/></marker></defs>
<rect x="24" y="399" width="712" height="65" rx="7" fill="#e0eef5" stroke="#80a9be"/>
<text x="40" y="425" font-weight="700">1  Check shape</text>
<text x="40" y="450">Read names; copy each field into RawMessage.</text>
<path d="M 380 464 V 483" stroke="#176b87" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="486" width="712" height="65" rx="7" fill="#e0eef5" stroke="#80a9be"/>
<text x="40" y="512" font-weight="700">2  Fill Go fields</text>
<text x="40" y="537">json.Unmarshal reads the original object again.</text>
<path d="M 380 551 V 570" stroke="#176b87" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="573" width="712" height="65" rx="7" fill="#e0eef5" stroke="#80a9be"/>
<text x="40" y="599" font-weight="700">3  Enter a nested type</text>
<text x="40" y="624">Its checking hook repeats steps 1 and 2.</text>
<text x="24" y="680" class="small">Sequence illustrates current code; it is not a count of scans per byte.</text>
</svg>
