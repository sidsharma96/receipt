<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 778" role="img" aria-label="A second client reuses output without executing the test">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#266c91"/></marker></defs>
<rect width="480" height="778" rx="12" fill="#fcfbf7"/>
<style>text{font-family:system-ui,sans-serif;fill:#24394b;font-size:18px}.small{font-size:16px}.title{font-size:22px;font-weight:650}.arrow{stroke:#266c91;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
<text x="24" y="34" class="title">What actually runs?</text><rect x="24" y="60" width="200" height="54" rx="8" fill="#e8f2f5" stroke="#7596a7"/><text x="124" y="92" text-anchor="middle">First client</text><rect x="265" y="60" width="190" height="54" rx="8" fill="#e8f2f5" stroke="#7596a7"/><text x="360" y="92" text-anchor="middle">Shared cache</text><path class="arrow" d="M224 141 L265 141"/><text x="25" y="147" class="">1. Ask for key K</text><path class="arrow" d="M265 184 L224 184"/><text x="280" y="175" class="">No result</text><rect x="24" y="216" width="200" height="75" rx="8" fill="#fff2d6" stroke="#7596a7"/><text x="124" y="248" text-anchor="middle">2. Run tests</text><text x="40" y="271" class="small">Marker: 0 → 1</text><path class="arrow" d="M224 316 L265 316"/><text x="25" y="310" class="">3. Upload success</text><rect x="265" y="339" width="190" height="58" rx="8" fill="#e1f2e8" stroke="#7596a7"/><text x="360" y="371" text-anchor="middle">K → saved output</text><path d="M24 429H455" stroke="#9cabb4" stroke-dasharray="5 5"/><rect x="24" y="454" width="200" height="75" rx="8" fill="#e8f2f5" stroke="#7596a7"/><text x="124" y="486" text-anchor="middle">Second client</text><text x="40" y="508" class="small">Local cache: empty</text><path class="arrow" d="M224 556 L265 556"/><text x="25" y="550" class="">4. Ask for key K</text><path class="arrow" d="M265 601 L224 601"/><text x="280" y="590" class="">Saved output</text><rect x="24" y="633" width="431" height="75" rx="8" fill="#e1f2e8" stroke="#7596a7"/><text x="239.5" y="665" text-anchor="middle">5. Print output; do not start tests</text><text x="43" y="686" class="small">Marker stays at 1. No second test execution.</text><text x="24" y="746" class="">K is illustrative. Arrows are order, not timing.</text></svg>
