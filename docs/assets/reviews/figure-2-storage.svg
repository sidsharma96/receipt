<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 395" role="img" aria-labelledby="storage-title storage-desc">
<title id="storage-title">Two result records share one output file X</title>
<desc id="storage-desc">Illustrative records and execution order, not measured timings. Read the text explanation below for details.</desc>
<rect width="720" height="100%" rx="12" fill="#fcfbf7"/>
<text x="30" y="35" font-family="system-ui, sans-serif" font-size="14" fill="#236ba0" text-anchor="start">POSTGRESQL: descriptions</text>
<text x="458" y="35" font-family="system-ui, sans-serif" font-size="14" fill="#167767" text-anchor="start">FILESYSTEM: output bytes</text>
<rect x="30" y="80" width="220" height="104" rx="6" fill="#ffffff" stroke="#236ba0"/>
<text x="48" y="109" font-family="system-ui, sans-serif" font-size="20" fill="#24394b" text-anchor="start">Result K1</text>
<text x="48" y="138" font-family="system-ui, sans-serif" font-size="16" fill="#236ba0" text-anchor="start">stdout → X</text>
<text x="48" y="163" font-family="system-ui, sans-serif" font-size="16" fill="#167767" text-anchor="start">stderr → Y</text>
<path d="M250 133 L485 129" fill="none" stroke="#236ba0" stroke-width="2"/>
<path d="M477.0 133.1 L485 129 L476.8 125.2" fill="none" stroke="#236ba0" stroke-width="2"/>
<path d="M250 160 L485 284" fill="none" stroke="#167767" stroke-width="2"/>
<path d="M476.0 283.7 L485 284 L479.7 276.8" fill="none" stroke="#167767" stroke-width="2"/>
<rect x="30" y="240" width="220" height="104" rx="6" fill="#ffffff" stroke="#236ba0"/>
<text x="48" y="269" font-family="system-ui, sans-serif" font-size="20" fill="#24394b" text-anchor="start">Result K2</text>
<text x="48" y="298" font-family="system-ui, sans-serif" font-size="16" fill="#236ba0" text-anchor="start">stdout → X</text>
<text x="48" y="323" font-family="system-ui, sans-serif" font-size="16" fill="#167767" text-anchor="start">stderr → Y</text>
<path d="M250 293 L485 129" fill="none" stroke="#236ba0" stroke-width="2"/>
<path d="M480.6 136.8 L485 129 L476.1 130.4" fill="none" stroke="#236ba0" stroke-width="2"/>
<path d="M250 320 L485 284" fill="none" stroke="#167767" stroke-width="2"/>
<path d="M477.6 289.1 L485 284 L476.4 281.4" fill="none" stroke="#167767" stroke-width="2"/>
<path d="M504 91 h44 l14 14 v62 h-58 Z M548 91 v14 h14" fill="#ffffff" stroke="#236ba0" stroke-width="2"/>
<text x="533" y="138" font-family="system-ui, sans-serif" font-size="18" fill="#236ba0" text-anchor="middle">X</text>
<text x="584" y="133" font-family="system-ui, sans-serif" font-size="14" fill="#24394b" text-anchor="start">“tests passed”</text>
<path d="M504 246 h44 l14 14 v62 h-58 Z M548 246 v14 h14" fill="#ffffff" stroke="#167767" stroke-width="2"/>
<text x="533" y="293" font-family="system-ui, sans-serif" font-size="18" fill="#167767" text-anchor="middle">Y</text>
<text x="584" y="288" font-family="system-ui, sans-serif" font-size="14" fill="#24394b" text-anchor="start">empty stderr</text>
<text x="32" y="379" font-family="system-ui, sans-serif" font-size="17" fill="#24394b" text-anchor="start">Two references to X do not require two copies of X.</text>
</svg>
