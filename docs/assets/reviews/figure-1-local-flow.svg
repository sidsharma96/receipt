<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="local-flow-title local-flow-desc">
<title id="local-flow-title">A cache hit replays output; a miss runs the command and checks inputs again</title>
<desc id="local-flow-desc">Illustrative records and execution order, not measured timings. Read the text explanation below for details.</desc>
<rect width="720" height="100%" rx="12" fill="#fcfbf7"/>
<rect x="205" y="25" width="310" height="52" rx="6" fill="#ffffff" stroke="#236ba0"/>
<text x="360" y="57" font-family="system-ui, sans-serif" font-size="17" fill="#236ba0" text-anchor="middle">Describe inputs → look up key</text>
<path d="M280 77 L155 144" fill="none" stroke="#167767" stroke-width="2"/>
<path d="M160.3 136.7 L155 144 L164.0 143.6" fill="none" stroke="#167767" stroke-width="2"/>
<path d="M440 77 L562 144" fill="none" stroke="#97650d" stroke-width="2"/>
<path d="M553.0 143.5 L562 144 L556.8 136.7" fill="none" stroke="#97650d" stroke-width="2"/>
<text x="160" y="108" font-family="system-ui, sans-serif" font-size="14" fill="#167767" text-anchor="start">usable hit</text>
<text x="490" y="108" font-family="system-ui, sans-serif" font-size="14" fill="#97650d" text-anchor="start">miss</text>
<rect x="30" y="152" width="255" height="62" rx="6" fill="#e3f1eb" stroke="#167767"/>
<text x="157" y="189" font-family="system-ui, sans-serif" font-size="18" fill="#167767" text-anchor="middle">Print saved output</text>
<rect x="435" y="152" width="255" height="62" rx="6" fill="#fff2d6" stroke="#97650d"/>
<text x="562" y="189" font-family="system-ui, sans-serif" font-size="18" fill="#97650d" text-anchor="middle">Run pytest</text>
<path d="M562 215 L562 267" fill="none" stroke="#97650d" stroke-width="2"/>
<path d="M558.1 258.9 L562 267 L565.9 258.9" fill="none" stroke="#97650d" stroke-width="2"/>
<rect x="415" y="275" width="280" height="66" rx="6" fill="#ffffff" stroke="#236ba0"/>
<text x="555" y="303" font-family="system-ui, sans-serif" font-size="17" fill="#236ba0" text-anchor="middle">Describe inputs again</text>
<text x="555" y="326" font-family="system-ui, sans-serif" font-size="14" fill="#236ba0" text-anchor="middle">same? successful? fits?</text>
<path d="M555 342 L555 388" fill="none" stroke="#167767" stroke-width="2"/>
<path d="M551.1 379.9 L555 388 L558.9 379.9" fill="none" stroke="#167767" stroke-width="2"/>
<text x="580" y="374" font-family="system-ui, sans-serif" font-size="13" fill="#167767" text-anchor="start">eligible</text>
<rect x="415" y="396" width="280" height="48" rx="6" fill="#e3f1eb" stroke="#167767"/>
<text x="555" y="425" font-family="system-ui, sans-serif" font-size="17" fill="#167767" text-anchor="middle">Save for another run</text>
<path d="M415 308 L294 308" fill="none" stroke="#ac3c43" stroke-width="2"/>
<path d="M302.1 304.1 L294 308 L302.1 311.9" fill="none" stroke="#ac3c43" stroke-width="2"/>
<text x="45" y="305" font-family="system-ui, sans-serif" font-size="16" fill="#ac3c43" text-anchor="start">Otherwise: do not save.</text>
<text x="45" y="332" font-family="system-ui, sans-serif" font-size="15" fill="#24394b" text-anchor="start">The command still ran.</text>
<text x="32" y="447" font-family="system-ui, sans-serif" font-size="17" fill="#167767" text-anchor="start">A hit does not run pytest.</text>
</svg>
