<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" role="img" aria-labelledby="cargo-graph-title cargo-graph-desc">
<title id="cargo-graph-title">One selected crate can reach the same dependency through two branches</title>
<desc id="cargo-graph-desc">Illustrative records and execution order, not measured timings. Read the text explanation below for details.</desc>
<rect width="720" height="100%" rx="12" fill="#fcfbf7"/>
<text x="25" y="30" font-family="system-ui, sans-serif" font-size="14" fill="#24394b" text-anchor="start">ILLUSTRATIVE PACKAGE GRAPH · ARROWS MEAN “NEEDS”</text>
<rect x="270" y="60" width="180" height="48" rx="6" fill="#edf5ef" stroke="#167767"/>
<text x="360" y="90" font-family="system-ui, sans-serif" font-size="18" fill="#24394b" text-anchor="middle">Selected crate</text>
<rect x="80" y="175" width="180" height="48" rx="6" fill="#edf5ef" stroke="#167767"/>
<text x="170" y="205" font-family="system-ui, sans-serif" font-size="18" fill="#24394b" text-anchor="middle">Library A</text>
<rect x="460" y="175" width="180" height="48" rx="6" fill="#edf5ef" stroke="#167767"/>
<text x="550" y="205" font-family="system-ui, sans-serif" font-size="18" fill="#24394b" text-anchor="middle">Test helper B</text>
<rect x="270" y="285" width="180" height="48" rx="6" fill="#edf5ef" stroke="#167767"/>
<text x="360" y="315" font-family="system-ui, sans-serif" font-size="18" fill="#24394b" text-anchor="middle">Common C</text>
<path d="M300 108 L170 175" fill="none" stroke="#236ba0" stroke-width="2"/>
<path d="M175.4 167.8 L170 175 L179.0 174.8" fill="none" stroke="#236ba0" stroke-width="2"/>
<path d="M420 108 L550 175" fill="none" stroke="#236ba0" stroke-width="2"/>
<path d="M541.0 174.8 L550 175 L544.6 167.8" fill="none" stroke="#236ba0" stroke-width="2"/>
<text x="25" y="143" font-family="system-ui, sans-serif" font-size="14" fill="#236ba0" text-anchor="start">normal dependency</text>
<text x="530" y="143" font-family="system-ui, sans-serif" font-size="14" fill="#236ba0" text-anchor="start">test dependency</text>
<path d="M170 223 L300 285" fill="none" stroke="#236ba0" stroke-width="2"/>
<path d="M291.0 285.0 L300 285 L294.4 278.0" fill="none" stroke="#236ba0" stroke-width="2"/>
<path d="M550 223 L420 285" fill="none" stroke="#236ba0" stroke-width="2"/>
<path d="M425.6 278.0 L420 285 L429.0 285.0" fill="none" stroke="#236ba0" stroke-width="2"/>
<text x="360" y="362" font-family="system-ui, sans-serif" font-size="16" fill="#167767" text-anchor="middle">First visit to C: inspect it. Second visit: already seen → skip.</text>
<text x="360" y="389" font-family="system-ui, sans-serif" font-size="14" fill="#24394b" text-anchor="middle">A and B’s own test-only dependencies are not needed here.</text>
</svg>
