<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="interrupted-title interrupted-desc">
<title id="interrupted-title">A failed database publication leaves files for later cleanup</title>
<desc id="interrupted-desc">Illustrative records and execution order, not measured timings. Read the text explanation below for details.</desc>
<rect width="720" height="100%" rx="12" fill="#fcfbf7"/>
<text x="110" y="35" font-family="system-ui, sans-serif" font-size="17" fill="#24394b" text-anchor="middle">Writer</text>
<path d="M110 55 L110 355" fill="none" stroke="#b9c5c8" stroke-width="2" stroke-dasharray="5 6"/>
<text x="355" y="35" font-family="system-ui, sans-serif" font-size="17" fill="#24394b" text-anchor="middle">Output files</text>
<path d="M355 55 L355 355" fill="none" stroke="#b9c5c8" stroke-width="2" stroke-dasharray="5 6"/>
<text x="610" y="35" font-family="system-ui, sans-serif" font-size="17" fill="#24394b" text-anchor="middle">Database</text>
<path d="M610 55 L610 355" fill="none" stroke="#b9c5c8" stroke-width="2" stroke-dasharray="5 6"/>
<g data-step="1">
<path d="M110 100 L355 100" fill="none" stroke="#167767" stroke-width="2"/>
<path d="M346.9 103.9 L355 100 L346.9 96.1" fill="none" stroke="#167767" stroke-width="2"/>
<text x="215" y="85" font-family="system-ui, sans-serif" font-size="14" fill="#167767" text-anchor="middle">save X and Y</text>
</g>
<g data-step="2">
<path d="M110 188 L610 188" fill="none" stroke="#236ba0" stroke-width="2"/>
<path d="M601.9 191.9 L610 188 L601.9 184.1" fill="none" stroke="#236ba0" stroke-width="2"/>
<text x="365" y="169" font-family="system-ui, sans-serif" font-size="14" fill="#236ba0" text-anchor="middle">try to publish their references</text>
<circle cx="610" cy="225" r="20" fill="#ac3c43"/>
<text x="610" y="231" font-family="system-ui, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle">×</text>
<text x="450" y="263" font-family="system-ui, sans-serif" font-size="15" fill="#ac3c43" text-anchor="start">fails before commit</text>
</g>
<g data-step="3">
<path d="M325 282 h44 l14 14 v62 h-58 Z M369 282 v14 h14" fill="#ffffff" stroke="#167767" stroke-width="2"/>
<text x="354" y="329" font-family="system-ui, sans-serif" font-size="18" fill="#167767" text-anchor="middle">X</text>
<path d="M395 282 h44 l14 14 v62 h-58 Z M439 282 v14 h14" fill="#ffffff" stroke="#167767" stroke-width="2"/>
<text x="424" y="329" font-family="system-ui, sans-serif" font-size="18" fill="#167767" text-anchor="middle">Y</text>
<text x="40" y="390" font-family="system-ui, sans-serif" font-size="18" fill="#24394b" text-anchor="start">Files remain. No committed result points to them.</text>
</g>
</svg>
