<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 425" role="img" aria-labelledby="locks-title locks-desc">
<title id="locks-title">Shared reader locks make cleanup wait before deleting output</title>
<desc id="locks-desc">Illustrative records and execution order, not measured timings. Read the text explanation below for details.</desc>
<rect width="720" height="100%" rx="12" fill="#fcfbf7"/>
<text x="25" y="32" font-family="system-ui, sans-serif" font-size="14" fill="#24394b" text-anchor="start">Execution order → (spacing is not elapsed time)</text>
<text x="20" y="98" font-family="system-ui, sans-serif" font-size="16" fill="#24394b" text-anchor="start">Reader A</text>
<path d="M135 90 L685 90" fill="none" stroke="#c8d1d4" stroke-width="2"/>
<text x="20" y="168" font-family="system-ui, sans-serif" font-size="16" fill="#24394b" text-anchor="start">Reader B</text>
<path d="M135 160 L685 160" fill="none" stroke="#c8d1d4" stroke-width="2"/>
<text x="20" y="268" font-family="system-ui, sans-serif" font-size="16" fill="#24394b" text-anchor="start">Cleanup</text>
<path d="M135 260 L685 260" fill="none" stroke="#c8d1d4" stroke-width="2"/>
<g data-step="1">
<rect x="150" y="68" width="265" height="44" rx="6" fill="#dfedf7" stroke="#236ba0"/>
<text x="165" y="96" font-family="system-ui, sans-serif" font-size="14" fill="#236ba0" text-anchor="start">record → open X → read X</text>
<rect x="225" y="138" width="190" height="44" rx="6" fill="#dfedf7" stroke="#236ba0"/>
<text x="242" y="166" font-family="system-ui, sans-serif" font-size="14" fill="#236ba0" text-anchor="start">another reader</text>
</g>
<g data-step="2">
<rect x="245" y="238" width="170" height="44" rx="6" fill="#fff2d6" stroke="#97650d"/>
<text x="330" y="266" font-family="system-ui, sans-serif" font-size="16" fill="#97650d" text-anchor="middle">WAIT</text>
<path d="M415 50 L415 306" fill="none" stroke="#97650d" stroke-width="2" stroke-dasharray="5 6"/>
<text x="420" y="327" font-family="system-ui, sans-serif" font-size="14" fill="#97650d" text-anchor="middle">readers release locks</text>
</g>
<g data-step="3">
<rect x="430" y="238" width="245" height="44" rx="6" fill="#e3f1eb" stroke="#167767"/>
<text x="552" y="266" font-family="system-ui, sans-serif" font-size="14" fill="#167767" text-anchor="middle">cleanup can now proceed</text>
<text x="25" y="377" font-family="system-ui, sans-serif" font-size="16" fill="#24394b" text-anchor="start">The protected interval includes opening the file—not just reading SQL.</text>
</g>
</svg>
