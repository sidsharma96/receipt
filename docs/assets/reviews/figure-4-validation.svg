<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 530" role="img" aria-labelledby="validation-title validation-desc">
<title id="validation-title">Invalid uploads stop at the check they fail, before storage</title>
<desc id="validation-desc">Illustrative records and execution order, not measured timings. Read the text explanation below for details.</desc>
<rect width="720" height="100%" rx="12" fill="#fcfbf7"/>
<path d="M170 45 L170 475" fill="none" stroke="#236ba0" stroke-width="2"/>
<path d="M166.1 466.9 L170 475 L173.9 466.9" fill="none" stroke="#236ba0" stroke-width="2"/>
<g data-step="1">
<rect x="35" y="60" width="270" height="48" rx="6" fill="#ffffff" stroke="#236ba0"/>
<text x="170" y="90" font-family="system-ui, sans-serif" font-size="17" fill="#24394b" text-anchor="middle">Body size</text>
<path d="M305 84 L409 84" fill="none" stroke="#ac3c43" stroke-width="2"/>
<path d="M400.9 87.9 L409 84 L400.9 80.1" fill="none" stroke="#ac3c43" stroke-width="2"/>
<text x="430" y="78" font-family="system-ui, sans-serif" font-size="12" fill="#ac3c43" text-anchor="start">STOP</text>
<text x="430" y="99" font-family="system-ui, sans-serif" font-size="14" fill="#ac3c43" text-anchor="start">too large</text>
</g>
<g data-step="2">
<rect x="35" y="140" width="270" height="48" rx="6" fill="#ffffff" stroke="#236ba0"/>
<text x="170" y="170" font-family="system-ui, sans-serif" font-size="17" fill="#24394b" text-anchor="middle">Envelope fields</text>
<path d="M305 164 L409 164" fill="none" stroke="#ac3c43" stroke-width="2"/>
<path d="M400.9 167.9 L409 164 L400.9 160.1" fill="none" stroke="#ac3c43" stroke-width="2"/>
<text x="430" y="158" font-family="system-ui, sans-serif" font-size="12" fill="#ac3c43" text-anchor="start">STOP</text>
<text x="430" y="179" font-family="system-ui, sans-serif" font-size="14" fill="#ac3c43" text-anchor="start">unknown / duplicate field</text>
</g>
<g data-step="3">
<rect x="35" y="220" width="270" height="48" rx="6" fill="#ffffff" stroke="#236ba0"/>
<text x="170" y="250" font-family="system-ui, sans-serif" font-size="17" fill="#24394b" text-anchor="middle">Payload checksum</text>
<path d="M305 244 L409 244" fill="none" stroke="#ac3c43" stroke-width="2"/>
<path d="M400.9 247.9 L409 244 L400.9 240.1" fill="none" stroke="#ac3c43" stroke-width="2"/>
<text x="430" y="238" font-family="system-ui, sans-serif" font-size="12" fill="#ac3c43" text-anchor="start">STOP</text>
<text x="430" y="259" font-family="system-ui, sans-serif" font-size="14" fill="#ac3c43" text-anchor="start">bytes do not match digest</text>
</g>
<g data-step="4">
<rect x="35" y="300" width="270" height="48" rx="6" fill="#ffffff" stroke="#236ba0"/>
<text x="170" y="330" font-family="system-ui, sans-serif" font-size="17" fill="#24394b" text-anchor="middle">Result fields</text>
<path d="M305 324 L409 324" fill="none" stroke="#ac3c43" stroke-width="2"/>
<path d="M400.9 327.9 L409 324 L400.9 320.1" fill="none" stroke="#ac3c43" stroke-width="2"/>
<text x="430" y="318" font-family="system-ui, sans-serif" font-size="12" fill="#ac3c43" text-anchor="start">STOP</text>
<text x="430" y="339" font-family="system-ui, sans-serif" font-size="14" fill="#ac3c43" text-anchor="start">wrong type / missing field</text>
</g>
<g data-step="5">
<rect x="35" y="380" width="270" height="48" rx="6" fill="#ffffff" stroke="#236ba0"/>
<text x="170" y="410" font-family="system-ui, sans-serif" font-size="17" fill="#24394b" text-anchor="middle">Meaning and key</text>
<path d="M305 404 L409 404" fill="none" stroke="#ac3c43" stroke-width="2"/>
<path d="M400.9 407.9 L409 404 L400.9 400.1" fill="none" stroke="#ac3c43" stroke-width="2"/>
<text x="430" y="398" font-family="system-ui, sans-serif" font-size="12" fill="#ac3c43" text-anchor="start">STOP</text>
<text x="430" y="419" font-family="system-ui, sans-serif" font-size="14" fill="#ac3c43" text-anchor="start">invalid command / key mismatch</text>
</g>
<g data-step="6">
<rect x="35" y="474" width="270" height="42" rx="6" fill="#e3f1eb" stroke="#167767"/>
<text x="170" y="501" font-family="system-ui, sans-serif" font-size="15" fill="#167767" text-anchor="middle">Storage may now be called</text>
</g>
</svg>
