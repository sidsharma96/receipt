<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 455" role="img" aria-labelledby="cleanup-retry-title cleanup-retry-desc">
<title id="cleanup-retry-title">A cleanup retry examines what remains rather than undoing earlier deletions</title>
<desc id="cleanup-retry-desc">Illustrative records and execution order, not measured timings. Read the text explanation below for details.</desc>
<rect width="720" height="100%" rx="12" fill="#fcfbf7"/>
<text x="25" y="32" font-family="system-ui, sans-serif" font-size="13" fill="#24394b" text-anchor="start">EXECUTION ORDER ↓</text>
<text x="315" y="65" font-family="system-ui, sans-serif" font-size="15" fill="#24394b" text-anchor="middle">X: orphan</text>
<text x="465" y="65" font-family="system-ui, sans-serif" font-size="15" fill="#24394b" text-anchor="middle">Y: orphan</text>
<text x="615" y="65" font-family="system-ui, sans-serif" font-size="15" fill="#24394b" text-anchor="middle">L: referenced</text>
<g data-step="1">
<text x="25" y="135" font-family="system-ui, sans-serif" font-size="16" fill="#24394b" text-anchor="start">Before cleanup</text>
<path d="M286 95 h44 l14 14 v62 h-58 Z M330 95 v14 h14" fill="#ffffff" stroke="#236ba0" stroke-width="2"/>
<text x="315" y="142" font-family="system-ui, sans-serif" font-size="18" fill="#236ba0" text-anchor="middle">X</text>
<path d="M436 95 h44 l14 14 v62 h-58 Z M480 95 v14 h14" fill="#ffffff" stroke="#236ba0" stroke-width="2"/>
<text x="465" y="142" font-family="system-ui, sans-serif" font-size="18" fill="#236ba0" text-anchor="middle">Y</text>
<path d="M586 95 h44 l14 14 v62 h-58 Z M630 95 v14 h14" fill="#ffffff" stroke="#167767" stroke-width="2"/>
<text x="615" y="142" font-family="system-ui, sans-serif" font-size="18" fill="#167767" text-anchor="middle">L</text>
</g>
<g data-step="2">
<text x="25" y="265" font-family="system-ui, sans-serif" font-size="16" fill="#24394b" text-anchor="start">After deletion fails</text>
<path d="M291 242 L339 284" fill="none" stroke="#8b969b" stroke-width="2"/>
<path d="M339 242 L291 284" fill="none" stroke="#8b969b" stroke-width="2"/>
<text x="315" y="320" font-family="system-ui, sans-serif" font-size="13" fill="#526477" text-anchor="middle">gone</text>
<path d="M436 225 h44 l14 14 v62 h-58 Z M480 225 v14 h14" fill="#ffffff" stroke="#236ba0" stroke-width="2"/>
<text x="465" y="272" font-family="system-ui, sans-serif" font-size="18" fill="#236ba0" text-anchor="middle">Y</text>
<path d="M586 225 h44 l14 14 v62 h-58 Z M630 225 v14 h14" fill="#ffffff" stroke="#167767" stroke-width="2"/>
<text x="615" y="272" font-family="system-ui, sans-serif" font-size="18" fill="#167767" text-anchor="middle">L</text>
</g>
<g data-step="3">
<text x="25" y="395" font-family="system-ui, sans-serif" font-size="16" fill="#24394b" text-anchor="start">After successful retry</text>
<path d="M291 372 L339 414" fill="none" stroke="#8b969b" stroke-width="2"/>
<path d="M339 372 L291 414" fill="none" stroke="#8b969b" stroke-width="2"/>
<text x="315" y="450" font-family="system-ui, sans-serif" font-size="13" fill="#526477" text-anchor="middle">gone</text>
<path d="M441 372 L489 414" fill="none" stroke="#8b969b" stroke-width="2"/>
<path d="M489 372 L441 414" fill="none" stroke="#8b969b" stroke-width="2"/>
<text x="465" y="450" font-family="system-ui, sans-serif" font-size="13" fill="#526477" text-anchor="middle">gone</text>
<path d="M586 355 h44 l14 14 v62 h-58 Z M630 355 v14 h14" fill="#ffffff" stroke="#167767" stroke-width="2"/>
<text x="615" y="402" font-family="system-ui, sans-serif" font-size="18" fill="#167767" text-anchor="middle">L</text>
</g>
<g data-step="2">
<text x="25" y="200" font-family="system-ui, sans-serif" font-size="14" fill="#ac3c43" text-anchor="start">delete X ✓; delete Y fails</text>
</g>
<g data-step="3">
<text x="25" y="330" font-family="system-ui, sans-serif" font-size="14" fill="#167767" text-anchor="start">rescan, then delete Y ✓</text>
</g>
</svg>
