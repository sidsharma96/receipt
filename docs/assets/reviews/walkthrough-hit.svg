<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" role="img" aria-labelledby="title desc">
<title id="title">A local hit still checks shared status</title><desc id="desc">Receipt loads K locally, asks the remote server about quarantine, and replays output if status allows it. An unavailable status or quarantine leads to execution instead.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#52645a"/></marker></defs><rect width="400" height="450" fill="#fcfcf9"/>
<g font-family="system-ui,sans-serif" font-size="17" fill="#24332e" text-anchor="middle"><text x="200" y="28" font-weight="600">HIT · local copy, remote configured</text><text x="65" y="65">Receipt</text><text x="205" y="65">Local cache</text><text x="340" y="65">Server</text>
<text x="135" y="103">Load K</text><text x="135" y="164">Saved result</text><text x="200" y="227">Check shared quarantine</text><text x="200" y="292">No quarantine reported</text>
<rect x="20" y="328" width="360" height="52" rx="8" fill="#eef4ef" stroke="#a8bbaf"/><text x="200" y="350">Replay output and exit code</text><text x="200" y="372">pytest is NOT started</text><text x="200" y="410">If status fails or K is quarantined:</text><text x="200" y="434">execute instead of replaying.</text></g>
<g stroke="#c4cec7" stroke-dasharray="4 5"><path d="M65 77V321M205 77V196M340 77V321"/></g><g stroke="#52645a" stroke-width="2" marker-end="url(#arrow)" fill="none"><path d="M65 117H202"/><path d="M205 178H68"/><path d="M65 242H337"/><path d="M340 306H68"/><path d="M65 309V324"/></g></svg>
