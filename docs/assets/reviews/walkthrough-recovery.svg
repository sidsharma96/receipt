<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 620" role="img" aria-labelledby="title desc">
<title id="title">Recover a downloaded backup without replacing live data</title><desc id="desc">While paused, database and output files are copied together. Receipt restarts before encryption and upload to R2. The downloaded archive is decrypted on the Mac, then restored separately for checks. Live data is not overwritten.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#52645a"/></marker></defs><rect width="400" height="620" fill="#fcfcf9"/>
<g font-family="system-ui,sans-serif" font-size="17" fill="#24332e" text-anchor="middle"><text x="200" y="27" font-weight="600">RECOVERY · test the downloaded copy</text>
<text x="200" y="63">Pause Receipt while copying both</text><g fill="#eef4ef" stroke="#a8bbaf"><rect x="15" y="79" width="170" height="50" rx="8"/><rect x="215" y="79" width="170" height="50" rx="8"/></g><text x="100" y="110">Database records</text><text x="300" y="110">Output files</text>
<text x="200" y="184">One archive + selected configuration</text><text x="200" y="216" font-weight="600">Restart live Receipt</text>
<rect x="55" y="245" width="290" height="56" rx="8" fill="#eef4ef" stroke="#a8bbaf"/><text x="200" y="268">Encrypt → upload to R2</text><text x="200" y="290">Private key stays on Mac</text>
<text x="200" y="349">Download actual R2 object</text><text x="200" y="393">Mac: decrypt with private key</text>
<g fill="#eef4ef" stroke="#a8bbaf"><rect x="15" y="437" width="170" height="58" rx="8"/><rect x="215" y="437" width="170" height="58" rx="8"/></g><text x="100" y="461">Separate test</text><text x="100" y="483">database</text><text x="300" y="461">Separate restored</text><text x="300" y="483">files</text>
<text x="200" y="550">Verify checksums + fetch results</text><text x="200" y="589" font-weight="600">Live data is not replaced</text><text x="200" y="613" font-size="15">Same host tested; new-host recovery not tested.</text></g>
<g stroke="#52645a" stroke-width="2" fill="none"><path d="M100 129V148H300V129M100 495V516H300V495"/><g marker-end="url(#arrow)"><path d="M200 148V163"/><path d="M200 222V241"/><path d="M200 301V328"/><path d="M200 355V372"/><path d="M200 400V416H100V433"/><path d="M200 416H300V433"/><path d="M200 516V531"/></g></g></svg>
