<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 315" role="img" aria-labelledby="measured-wait-title measured-wait-desc">
<title id="measured-wait-title">Concurrent uploads spent much of their measured time waiting for the database lock</title>
<desc id="measured-wait-desc">Measured local observations, not a general performance guarantee. Read the text explanation below for details.</desc>
<rect width="720" height="100%" rx="12" fill="#fcfbf7"/>
<text x="25" y="32" font-family="system-ui, sans-serif" font-size="14" fill="#24394b" text-anchor="start">128 ENTRIES · 4 CLIENT WORKERS · 32 REPEATED UPLOADS</text>
<text x="25" y="110" font-family="system-ui, sans-serif" font-size="16" fill="#24394b" text-anchor="start">Whole request</text>
<rect x="230" y="82" width="373.65272140625" height="40" rx="2" fill="#f0f3ef" stroke="#236ba0"/>
<text x="613.6527214062501" y="110" font-family="system-ui, sans-serif" font-size="15" fill="#236ba0" text-anchor="start">74.7 ms</text>
<text x="25" y="215" font-family="system-ui, sans-serif" font-size="16" fill="#24394b" text-anchor="start">Database lock call</text>
<rect x="230" y="187" width="272.795299375" height="40" rx="2" fill="#f0f3ef" stroke="#97650d"/>
<text x="512.795299375" y="215" font-family="system-ui, sans-serif" font-size="15" fill="#97650d" text-anchor="start">54.6 ms</text>
<text x="25" y="283" font-family="system-ui, sans-serif" font-size="15" fill="#24394b" text-anchor="start">Mean durations, same scale. The lock call is inside the request—not extra.</text>
</svg>
