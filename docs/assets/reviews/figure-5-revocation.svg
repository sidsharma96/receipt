<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="revocation-title revocation-desc">
<title id="revocation-title">Revoking a credential does not cancel a request already admitted</title>
<desc id="revocation-desc">Illustrative records and execution order, not measured timings. Read the text explanation below for details.</desc>
<rect width="720" height="100%" rx="12" fill="#fcfbf7"/>
<text x="25" y="33" font-family="system-ui, sans-serif" font-size="14" fill="#24394b" text-anchor="start">Execution order → (not a duration chart)</text>
<text x="25" y="105" font-family="system-ui, sans-serif" font-size="16" fill="#24394b" text-anchor="start">Upload A</text>
<path d="M140 105 L685 105" fill="none" stroke="#c8d1d4" stroke-width="2"/>
<text x="25" y="213" font-family="system-ui, sans-serif" font-size="16" fill="#24394b" text-anchor="start">Operator</text>
<path d="M140 213 L685 213" fill="none" stroke="#c8d1d4" stroke-width="2"/>
<text x="25" y="320" font-family="system-ui, sans-serif" font-size="16" fill="#24394b" text-anchor="start">Request B</text>
<path d="M140 320 L685 320" fill="none" stroke="#c8d1d4" stroke-width="2"/>
<g data-step="1">
<circle cx="185" cy="105" r="20" fill="#167767"/>
<text x="185" y="111" font-family="system-ui, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle">✓</text>
<text x="185" y="77" font-family="system-ui, sans-serif" font-size="14" fill="#167767" text-anchor="middle">approved</text>
<rect x="218" y="87" width="190" height="36" rx="6" fill="#dfedf7" stroke="#236ba0"/>
<text x="310" y="111" font-family="system-ui, sans-serif" font-size="14" fill="#236ba0" text-anchor="middle">in progress</text>
</g>
<g data-step="2">
<circle cx="435" cy="213" r="20" fill="#ac3c43"/>
<text x="435" y="219" font-family="system-ui, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle">×</text>
<path d="M435 55 L435 355" fill="none" stroke="#ac3c43" stroke-width="2" stroke-dasharray="5 6"/>
<text x="435" y="253" font-family="system-ui, sans-serif" font-size="15" fill="#ac3c43" text-anchor="middle">revocation commits</text>
</g>
<g data-step="3">
<path d="M409 105 L650 105" fill="none" stroke="#167767" stroke-width="2"/>
<path d="M641.9 108.9 L650 105 L641.9 101.1" fill="none" stroke="#167767" stroke-width="2"/>
<text x="550" y="80" font-family="system-ui, sans-serif" font-size="15" fill="#167767" text-anchor="middle">may still finish</text>
<circle cx="578" cy="320" r="20" fill="#ac3c43"/>
<text x="578" y="326" font-family="system-ui, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle">×</text>
<text x="578" y="353" font-family="system-ui, sans-serif" font-size="15" fill="#ac3c43" text-anchor="middle">new check → 401</text>
<text x="25" y="399" font-family="system-ui, sans-serif" font-size="16" fill="#24394b" text-anchor="start">The decision belongs to the request’s credential check, not its finish time.</text>
</g>
</svg>
