<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 770" role="img" aria-label="A failed upload can leave a file but no database result">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#266c91"/></marker></defs>
<rect width="480" height="770" rx="12" fill="#fcfbf7"/>
<style>text{font-family:system-ui,sans-serif;fill:#24394b;font-size:18px}.small{font-size:16px}.title{font-size:22px;font-weight:650}.arrow{stroke:#266c91;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
<text x="24" y="34" class="title">A failed save is not “nothing happened”</text><text x="30" y="79" class="">DATABASE</text><text x="273" y="79" class="">FILES</text><rect x="24" y="96" width="195" height="66" rx="8" fill="#e8f2f5" stroke="#7596a7"/><text x="121.5" y="128" text-anchor="middle">No result K</text><rect x="263" y="96" width="193" height="66" rx="8" fill="#e8f2f5" stroke="#7596a7"/><text x="359.5" y="128" text-anchor="middle">No file X</text><path class="arrow" d="M360 165 L360 222"/><text x="25" y="202" class="">1. Publish output file X.</text><rect x="24" y="238" width="195" height="66" rx="8" fill="#e8f2f5" stroke="#7596a7"/><text x="121.5" y="270" text-anchor="middle">No result K</text><rect x="263" y="238" width="193" height="66" rx="8" fill="#e1f2e8" stroke="#7596a7"/><text x="359.5" y="270" text-anchor="middle">X exists</text><text x="25" y="350" class="title">2. Database save fails.</text><path d="M115 314l18 18m0-18l-18 18" stroke="#ac3c43" stroke-width="4"/><rect x="24" y="375" width="195" height="66" rx="8" fill="#fbe8e8" stroke="#7596a7"/><text x="121.5" y="407" text-anchor="middle">Still no result K</text><rect x="263" y="375" width="193" height="66" rx="8" fill="#fff2d6" stroke="#7596a7"/><text x="359.5" y="407" text-anchor="middle">X still exists</text><text x="25" y="478" class="">No record points to X. The client cannot replay K.</text><path class="arrow" d="M120 492 L120 543"/><path class="arrow" d="M360 492 L360 543"/><rect x="24" y="560" width="431" height="98" rx="8" fill="#e8f2f5" stroke="#7596a7"/><text x="239.5" y="592" text-anchor="middle">3. Later cleanup checks references</text><text x="45" y="620" class="small">If X is still unused, it may delete X.</text><text x="24" y="704" class="">A retry must establish a complete saved result.</text><text x="24" y="733" class="">It cannot treat the leftover file as a cache hit.</text></svg>
