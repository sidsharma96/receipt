<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="keys-title keys-desc">
<title id="keys-title">Editing recorded file bytes changes the lookup key in this example</title>
<desc id="keys-desc">Illustrative records and execution order, not measured timings. Read the text explanation below for details.</desc>
<rect width="720" height="100%" rx="12" fill="#fcfbf7"/>
<text x="25" y="50" font-family="system-ui, sans-serif" font-size="12" fill="#236ba0" text-anchor="start">BEFORE</text>
<path d="M28 80 h44 l14 14 v62 h-58 Z M72 80 v14 h14" fill="#ffffff" stroke="#236ba0" stroke-width="2"/>
<text x="57" y="127" font-family="system-ui, sans-serif" font-size="18" fill="#236ba0" text-anchor="middle">A</text>
<text x="110" y="100" font-family="system-ui, sans-serif" font-size="16" fill="#236ba0" text-anchor="start">original bytes</text>
<path d="M110 122 L285 122" fill="none" stroke="#236ba0" stroke-width="2"/>
<path d="M276.9 125.9 L285 122 L276.9 118.1" fill="none" stroke="#236ba0" stroke-width="2"/>
<rect x="300" y="80" width="180" height="76" rx="6" fill="#ffffff" stroke="#236ba0"/>
<text x="390" y="110" font-family="system-ui, sans-serif" font-size="18" fill="#236ba0" text-anchor="middle">Manifest</text>
<text x="390" y="135" font-family="system-ui, sans-serif" font-size="14" fill="#236ba0" text-anchor="middle">file hash = A</text>
<path d="M480 118 L564 118" fill="none" stroke="#236ba0" stroke-width="2"/>
<path d="M555.9 121.9 L564 118 L555.9 114.1" fill="none" stroke="#236ba0" stroke-width="2"/>
<circle cx="608" cy="118" r="20" fill="#236ba0"/>
<text x="608" y="124" font-family="system-ui, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle">K1</text>
<text x="25" y="205" font-family="system-ui, sans-serif" font-size="12" fill="#167767" text-anchor="start">AFTER</text>
<path d="M28 235 h44 l14 14 v62 h-58 Z M72 235 v14 h14" fill="#ffffff" stroke="#167767" stroke-width="2"/>
<text x="57" y="282" font-family="system-ui, sans-serif" font-size="18" fill="#167767" text-anchor="middle">B</text>
<text x="110" y="255" font-family="system-ui, sans-serif" font-size="16" fill="#167767" text-anchor="start">edited bytes</text>
<path d="M110 277 L285 277" fill="none" stroke="#167767" stroke-width="2"/>
<path d="M276.9 280.9 L285 277 L276.9 273.1" fill="none" stroke="#167767" stroke-width="2"/>
<rect x="300" y="235" width="180" height="76" rx="6" fill="#ffffff" stroke="#167767"/>
<text x="390" y="265" font-family="system-ui, sans-serif" font-size="18" fill="#167767" text-anchor="middle">Manifest</text>
<text x="390" y="290" font-family="system-ui, sans-serif" font-size="14" fill="#167767" text-anchor="middle">file hash = B</text>
<path d="M480 273 L564 273" fill="none" stroke="#167767" stroke-width="2"/>
<path d="M555.9 276.9 L564 273 L555.9 269.1" fill="none" stroke="#167767" stroke-width="2"/>
<circle cx="608" cy="273" r="20" fill="#167767"/>
<text x="608" y="279" font-family="system-ui, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle">K2</text>
<path d="M390 158 L390 217" fill="none" stroke="#97650d" stroke-width="2" stroke-dasharray="5 6"/>
<text x="418" y="194" font-family="system-ui, sans-serif" font-size="13" fill="#97650d" text-anchor="start">only this field changes</text>
</svg>
