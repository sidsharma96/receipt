<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 355" role="img" aria-labelledby="cargo-mutation-title cargo-mutation-desc">
<title id="cargo-mutation-title">Changing a copied dependency prevents reuse despite an unchanged lockfile</title>
<desc id="cargo-mutation-desc">Illustrative records and execution order, not measured timings. Read the text explanation below for details.</desc>
<rect width="720" height="100%" rx="12" fill="#fcfbf7"/>
<text x="25" y="30" font-family="system-ui, sans-serif" font-size="14" fill="#24394b" text-anchor="start">REGRESSION SEQUENCE · KEYS A AND B ARE ILLUSTRATIVE</text>
<text x="25" y="65" font-family="system-ui, sans-serif" font-size="17" fill="#24394b" text-anchor="start">Cargo.lock is unchanged throughout.</text>
<rect x="25" y="95" width="190" height="160" rx="6" fill="#f7f8f4" stroke="#167767"/>
<text x="120" y="125" font-family="system-ui, sans-serif" font-size="16" fill="#24394b" text-anchor="middle">Original dependency</text>
<text x="120" y="157" font-family="system-ui, sans-serif" font-size="14" fill="#24394b" text-anchor="middle">Valid source</text>
<text x="120" y="195" font-family="system-ui, sans-serif" font-size="20" fill="#167767" text-anchor="middle">Key A</text>
<text x="120" y="230" font-family="system-ui, sans-serif" font-size="14" fill="#167767" text-anchor="middle">Execute → save success</text>
<rect x="265" y="95" width="190" height="160" rx="6" fill="#f7f8f4" stroke="#ac3c43"/>
<text x="360" y="125" font-family="system-ui, sans-serif" font-size="16" fill="#24394b" text-anchor="middle">Edited copy</text>
<text x="360" y="157" font-family="system-ui, sans-serif" font-size="14" fill="#24394b" text-anchor="middle">Compiler error added</text>
<text x="360" y="195" font-family="system-ui, sans-serif" font-size="20" fill="#ac3c43" text-anchor="middle">Key B</text>
<text x="360" y="230" font-family="system-ui, sans-serif" font-size="14" fill="#ac3c43" text-anchor="middle">Execute → fail; no save</text>
<rect x="505" y="95" width="190" height="160" rx="6" fill="#f7f8f4" stroke="#167767"/>
<text x="600" y="125" font-family="system-ui, sans-serif" font-size="16" fill="#24394b" text-anchor="middle">Restored copy</text>
<text x="600" y="157" font-family="system-ui, sans-serif" font-size="14" fill="#24394b" text-anchor="middle">Original bytes again</text>
<text x="600" y="195" font-family="system-ui, sans-serif" font-size="20" fill="#167767" text-anchor="middle">Key A</text>
<text x="600" y="230" font-family="system-ui, sans-serif" font-size="14" fill="#167767" text-anchor="middle">Replay saved success</text>
<path d="M215 178 L265 178" fill="none" stroke="#236ba0" stroke-width="2"/>
<path d="M256.9 181.9 L265 178 L256.9 174.1" fill="none" stroke="#236ba0" stroke-width="2"/>
<path d="M455 178 L505 178" fill="none" stroke="#236ba0" stroke-width="2"/>
<path d="M496.9 181.9 L505 178 L496.9 174.1" fill="none" stroke="#236ba0" stroke-width="2"/>
<text x="25" y="290" font-family="system-ui, sans-serif" font-size="15" fill="#24394b" text-anchor="start">Before the edited run: clear only the fixture’s compiled dependency files.</text>
<text x="25" y="319" font-family="system-ui, sans-serif" font-size="15" fill="#24394b" text-anchor="start">Otherwise Cargo may reuse its own build output even when Receipt executes.</text>
</svg>
