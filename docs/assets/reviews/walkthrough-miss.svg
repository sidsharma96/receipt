<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 580" role="img" aria-labelledby="title desc">
<title id="title">A miss runs the tests on the client</title><desc id="desc">Inputs produce key K. Neither local nor remote cache has K. Pytest runs on the client. Successful stable bounded output can be saved; otherwise no reusable result is saved.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#52645a"/></marker></defs>
<rect width="400" height="580" fill="#fcfcf9"/>
<g font-family="system-ui,sans-serif" font-size="17" text-anchor="middle" fill="#24332e">
<text x="200" y="28" font-weight="600">MISS · no reusable result for K</text>
<g fill="#eef4ef" stroke="#a8bbaf"><rect x="50" y="48" width="300" height="52" rx="8"/><rect x="50" y="138" width="300" height="64" rx="8"/><rect x="50" y="246" width="300" height="62" rx="8"/></g>
<text x="200" y="80">Recorded inputs → key K</text>
<text x="200" y="164">Local cache: absent</text><text x="200" y="188">Remote cache: absent</text>
<text x="200" y="272">Client runs pytest</text><text x="200" y="295">Remote server does not</text>
<path d="M200 348L358 397L200 446L42 397Z" fill="#fff3df" stroke="#b49d72"/>
<text x="200" y="386">Passed, inputs stable,</text><text x="200" y="410">output within limit?</text>
<text x="75" y="466">Yes*</text><text x="325" y="466">No</text>
<rect x="10" y="487" width="185" height="58" rx="8" fill="#eef4ef" stroke="#a8bbaf"/><rect x="215" y="487" width="175" height="58" rx="8" fill="#f4eee9" stroke="#c6b7ac"/>
<text x="102" y="511">Save locally;</text><text x="102" y="534">attempt upload</text><text x="302" y="511">Do not save</text><text x="302" y="534">a reusable result</text>
<text x="200" y="571" font-size="15">*Also requires K not already quarantined.</text>
</g><g fill="none" stroke="#52645a" stroke-width="2" marker-end="url(#arrow)"><path d="M200 100V134"/><path d="M200 202V242"/><path d="M200 308V344"/><path d="M95 414V483"/><path d="M305 414V483"/></g></svg>
