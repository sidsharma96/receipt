<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 325" role="img" aria-labelledby="scan-gap-title scan-gap-desc">
<title id="scan-gap-title">Two matching scans can miss a temporary change during execution</title>
<desc id="scan-gap-desc">Illustrative records and execution order, not measured timings. Read the text explanation below for details.</desc>
<rect width="720" height="100%" rx="12" fill="#fcfbf7"/>
<text x="25" y="33" font-family="system-ui, sans-serif" font-size="16" fill="#24394b" text-anchor="start">One possible execution →</text>
<path d="M80 110 h44 l14 14 v62 h-58 Z M124 110 v14 h14" fill="#ffffff" stroke="#236ba0" stroke-width="2"/>
<text x="109" y="157" font-family="system-ui, sans-serif" font-size="18" fill="#236ba0" text-anchor="middle">A</text>
<path d="M330 110 h44 l14 14 v62 h-58 Z M374 110 v14 h14" fill="#ffffff" stroke="#ac3c43" stroke-width="2"/>
<text x="359" y="157" font-family="system-ui, sans-serif" font-size="18" fill="#ac3c43" text-anchor="middle">B</text>
<path d="M580 110 h44 l14 14 v62 h-58 Z M624 110 v14 h14" fill="#ffffff" stroke="#236ba0" stroke-width="2"/>
<text x="609" y="157" font-family="system-ui, sans-serif" font-size="18" fill="#236ba0" text-anchor="middle">A</text>
<path d="M150 147 L310 147" fill="none" stroke="#ac3c43" stroke-width="2"/>
<path d="M301.9 150.9 L310 147 L301.9 143.1" fill="none" stroke="#ac3c43" stroke-width="2"/>
<path d="M400 147 L560 147" fill="none" stroke="#236ba0" stroke-width="2"/>
<path d="M551.9 150.9 L560 147 L551.9 143.1" fill="none" stroke="#236ba0" stroke-width="2"/>
<text x="232" y="126" font-family="system-ui, sans-serif" font-size="14" fill="#ac3c43" text-anchor="middle">file changes</text>
<text x="482" y="126" font-family="system-ui, sans-serif" font-size="14" fill="#236ba0" text-anchor="middle">file changes back</text>
<text x="109" y="85" font-family="system-ui, sans-serif" font-size="16" fill="#236ba0" text-anchor="middle">Receipt scans</text>
<text x="359" y="85" font-family="system-ui, sans-serif" font-size="16" fill="#ac3c43" text-anchor="middle">pytest reads</text>
<text x="609" y="85" font-family="system-ui, sans-serif" font-size="16" fill="#236ba0" text-anchor="middle">Receipt scans</text>
<path d="M109 211 L609 211" fill="none" stroke="#236ba0" stroke-width="2"/>
<text x="359" y="245" font-family="system-ui, sans-serif" font-size="19" fill="#236ba0" text-anchor="middle">Receipt compares A with A: equal</text>
<text x="359" y="289" font-family="system-ui, sans-serif" font-size="17" fill="#ac3c43" text-anchor="middle">But the test used B. Scanning is not freezing the files.</text>
</svg>
