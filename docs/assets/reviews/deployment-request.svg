<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 715" role="img" aria-label="Follow a request across the public and private boundary">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#266c91"/></marker></defs>
<rect width="480" height="715" rx="12" fill="#fcfbf7"/>
<style>text{font-family:system-ui,sans-serif;fill:#24394b;font-size:18px}.small{font-size:16px}.title{font-size:22px;font-weight:650}.arrow{stroke:#266c91;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
<text x="24" y="34" class="title">Find → connect → check → read</text><rect x="24" y="60" width="190" height="64" rx="8" fill="#e8f2f5" stroke="#7596a7"/><text x="119" y="92" text-anchor="middle">Mac or CI</text><rect x="265" y="60" width="190" height="64" rx="8" fill="#e8f2f5" stroke="#7596a7"/><text x="360" y="92" text-anchor="middle">Cloudflare DNS</text><path class="arrow" d="M214 82 L265 82"/><path class="arrow" d="M265 106 L214 106"/><text x="26" y="153" class="">1. DNS returns the droplet’s IP address.</text><path class="arrow" d="M120 164 L120 225"/><text x="143" y="190" class="">2. HTTPS over the internet</text><rect x="16" y="220" width="448" height="425" rx="12" fill="#f0f6ef" stroke="#50825f" stroke-dasharray="6 4"/><text x="35" y="252" class="small">ONE DROPLET</text><rect x="40" y="273" width="400" height="66" rx="8" fill="#e8f2f5" stroke="#7596a7"/><text x="240" y="305" text-anchor="middle">Caddy • public port 443</text><path class="arrow" d="M240 340 L240 395"/><text x="255" y="373" class="small">local HTTP</text><rect x="40" y="398" width="400" height="66" rx="8" fill="#e8f2f5" stroke="#7596a7"/><text x="240" y="430" text-anchor="middle">Receipt • private port 7777</text><text x="50" y="492" class="">3. Check token, then permission.</text><path class="arrow" d="M145 502 L125 544"/><path class="arrow" d="M335 502 L355 544"/><rect x="35" y="548" width="190" height="65" rx="8" fill="#e8f2f5" stroke="#7596a7"/><text x="130" y="580" text-anchor="middle">PostgreSQL</text><rect x="255" y="548" width="190" height="65" rx="8" fill="#e8f2f5" stroke="#7596a7"/><text x="350" y="580" text-anchor="middle">Output files</text><text x="45" y="636" class="small">4. Read the result; return through Caddy.</text><text x="24" y="680" class="">DNS gives directions. It does not carry the result.</text></svg>
