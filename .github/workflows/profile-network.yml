name: Network stage deep dive
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: network-deep-dive
  cancel-in-progress: false
jobs:
  client:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.22.12'
          cache: false
      - run: mkdir -p .tools
      - name: Measure read-only network stages
        run: python3 scripts/profile/network_deep_dive.py "$RUNNER_TEMP/receipt-network-profile"
        env:
          CGO_ENABLED: '0'
          RECEIPT_SELF_CI_TOKEN: ${{ secrets.RECEIPT_SELF_CI_TOKEN }}
      - name: Preserve numeric evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: network-deep-dive
          path: ${{ runner.temp }}/receipt-network-profile
          retention-days: 7
          if-no-files-found: error
