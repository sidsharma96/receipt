name: Private remote cache experiment
on:
  push:
    branches: [codex/ci-tunnel-experiment]
permissions:
  contents: read
concurrency:
  group: receipt-private-experiment
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.22.12'
          cache: false
      - run: go build -o /tmp/receipt-ci-client ./cmd/receipt
      - run: python3 deploy/ci/experiment.py publish
        env:
          RECEIPT_CI_SSH_KEY: ${{ secrets.RECEIPT_CI_SSH_KEY }}
          RECEIPT_CI_KNOWN_HOSTS: ${{ secrets.RECEIPT_CI_KNOWN_HOSTS }}
          RECEIPT_TOKEN: ${{ secrets.RECEIPT_CI_TOKEN }}
  replay-and-failures:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.22.12'
          cache: false
      - run: go build -o /tmp/receipt-ci-client ./cmd/receipt
      - run: python3 deploy/ci/experiment.py replay
        env:
          RECEIPT_CI_SSH_KEY: ${{ secrets.RECEIPT_CI_SSH_KEY }}
          RECEIPT_CI_KNOWN_HOSTS: ${{ secrets.RECEIPT_CI_KNOWN_HOSTS }}
          RECEIPT_TOKEN: ${{ secrets.RECEIPT_CI_TOKEN }}
