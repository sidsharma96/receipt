name: Receipt CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  uncached:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: receipt_test
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: receipt_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U receipt_test -d receipt_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.22.12'
          cache: false
      - name: Independent tests, including PostgreSQL and race detection
        run: go test -race -count=1 ./...
        env:
          RECEIPT_TEST_DATABASE_URL: postgres://receipt_test:disposable-ci-only@127.0.0.1:5432/receipt_test?sslmode=disable
      - name: Check source artifact policy
        run: |
          python3 scripts/check_source_artifacts.py --staged
          python3 -m unittest discover -s scripts/docs -p 'test_artifact_policy.py'
      - name: Check CI helper policy
        run: python3 -m unittest discover -s deploy/ci -p 'test_*.py'
  cached:
    # Never provide private-cache credentials to pull-request code.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.22.12'
          cache: false
      - run: go build -trimpath -buildvcs=false -o /tmp/receipt-self-client ./cmd/receipt
      - name: Run ordinary tests through Receipt
        run: python3 deploy/ci/self_test.py
        env:
          RECEIPT_SELF_CI_TOKEN: ${{ secrets.RECEIPT_SELF_CI_TOKEN }}
